# The calculator is public on its one port and calls nothing, not even DNS.
# So: ingress on 8080 only, and no egress at all. A compromised pod has
# nowhere to go.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "calculator.labels" . | nindent 6 }}
  # Egress listed with no egress rules = deny all egress.
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {port: 8080, protocol: TCP}
