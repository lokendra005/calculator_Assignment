# The calculator is public on 8080 and calls nothing, not even DNS. So: 8080
# from anywhere, 8081 from monitoring only, and no egress at all. A compromised pod has
# nowhere to go.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "calculator.labels" . | nindent 6 }}
  # Egress listed with no egress rules = deny all egress.
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - {port: 8080, protocol: TCP}
    # Admin port: only Prometheus. (kubelet probes come from the node and are
    # not subject to NetworkPolicy.)
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {port: 8081, protocol: TCP}
