# One node is enough for a laptop. The port mapping makes the NodePort
# reachable at http://localhost:30080 without kubectl port-forward.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: calc
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
