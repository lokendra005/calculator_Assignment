# kube-prometheus-stack, trimmed to fit a 2 GB Docker VM: Prometheus, Grafana,
# the operator and kube-state-metrics. No Alertmanager (alerts still evaluate
# and show as firing in Prometheus), no node-exporter.
alertmanager:
  enabled: false
nodeExporter:
  enabled: false
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}
prometheus:
  prometheusSpec:
    retention: 2d
    # Pick up ServiceMonitors and rules from any release, not only this one.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
prometheusOperator:
  resources: {requests: {memory: 64Mi}, limits: {memory: 128Mi}}
kube-state-metrics:
  resources: {requests: {memory: 32Mi}, limits: {memory: 96Mi}}
grafana:
  # Recreate, not rolling: two Grafanas during an upgrade OOM'd a 2 GB node.
  deploymentStrategy: {type: Recreate}
  resources: {requests: {memory: 128Mi}, limits: {memory: 256Mi}}
  # The admin password is generated by the chart into a Secret; read it with
  # make grafana. Nothing is committed.
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
