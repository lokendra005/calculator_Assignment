# kube-prometheus-stack, trimmed to fit a 2 GB Docker VM: Prometheus, Grafana,
# the operator and kube-state-metrics. No Alertmanager (alerts still evaluate
# and show as firing in Prometheus), no node-exporter.
alertmanager:
  enabled: false
nodeExporter:
  enabled: false
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}
prometheus:
  prometheusSpec:
    retention: 2d
    # Pick up ServiceMonitors and rules from any release, not only this one.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
grafana:
  # The admin password is generated by the chart into a Secret; read it with
  # make grafana. Nothing is committed.
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
